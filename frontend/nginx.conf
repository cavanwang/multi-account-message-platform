# 生产环境 nginx 配置：
#   - 伺服 Vite 构建产物（SPA，history 路由回退到 index.html）
#   - /api 与 /ws 反代到 backend 容器（同源部署，前端无需处理 CORS；
#     refresh cookie 的 Path=/api/auth 也因此能正常随请求携带）
#   - /health 供编排层健康检查（与原占位服务行为一致）

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 健康检查
    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"frontend"}';
    }

    # 后端 API
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket（需要 Upgrade 头）
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # WS 长连接：关闭代理读超时（默认 60s 会主动断空闲连接）
        proxy_read_timeout 3600s;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
